# Replace both domain names, then enable HTTPS with certbot before exposing users.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name suite.example.com;
    root /srv/business-suite/current/frontend/dist;
    index index.html;
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
    location /uploads/ {
        # Private downloads must pass through application authorization.
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health { proxy_pass http://127.0.0.1:8000; }
    location = /release.json { add_header Cache-Control no-store; }
    location = /config.js { add_header Cache-Control no-store; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 80;
    server_name interns.example.com;
    root /srv/business-suite/current/frontend/interns-hub/dist;
    index index.html;
    client_max_body_size 12m;
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /release.json { add_header Cache-Control no-store; }
    location = /config.js { add_header Cache-Control no-store; }
    location / { try_files $uri $uri/ /index.html; }
}
