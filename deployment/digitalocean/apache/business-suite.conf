# Business Suite and Interns Hub; other Apache sites remain independently configured.
<VirtualHost *:80>
 ServerName app.indianservers.com
 Alias /.well-known/acme-challenge/ /srv/business-suite/acme/.well-known/acme-challenge/
 <Directory /srv/business-suite/acme>
  Require all granted
 </Directory>
 RewriteEngine On
 RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
 RewriteRule ^ https://app.indianservers.com%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>
<VirtualHost *:80>
 ServerName interns-hub.indianservers.com
 Alias /.well-known/acme-challenge/ /srv/business-suite/acme/.well-known/acme-challenge/
 <Directory /srv/business-suite/acme>
  Require all granted
 </Directory>
 RewriteEngine On
 RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
 RewriteRule ^ https://interns-hub.indianservers.com%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>
<VirtualHost *:443>
 ServerName app.indianservers.com
 DocumentRoot /srv/business-suite/current/frontend/dist
 SSLEngine on
 SSLCertificateFile /etc/letsencrypt/live/business-suite/fullchain.pem
 SSLCertificateKeyFile /etc/letsencrypt/live/business-suite/privkey.pem
 SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
 ProxyPreserveHost On
 ProxyTimeout 300
 RequestHeader set X-Forwarded-Proto "https"
 ProxyPass /api/ http://127.0.0.1:8100/api/ upgrade=websocket
 ProxyPassReverse /api/ http://127.0.0.1:8100/api/
 ProxyPass /uploads/ http://127.0.0.1:8100/uploads/
 ProxyPassReverse /uploads/ http://127.0.0.1:8100/uploads/
 ProxyPass /health http://127.0.0.1:8100/health
 ProxyPassReverse /health http://127.0.0.1:8100/health
 ProxyPass /__/auth/ https://mlvisualizationsaimersweb.firebaseapp.com/__/auth/
 ProxyPassReverse /__/auth/ https://mlvisualizationsaimersweb.firebaseapp.com/__/auth/
 SSLProxyEngine On
 <Location /__/auth/>
  ProxyPreserveHost Off
 </Location>
 <Directory /srv/business-suite/current/frontend/dist>
  Options -Indexes +FollowSymLinks
  AllowOverride None
  Require all granted
  FallbackResource /index.html
 </Directory>
 <FilesMatch "^(index\.html|config\.js|release\.json)$">
  Header set Cache-Control "no-store"
 </FilesMatch>
 Header always set X-BusinessSuite-Origin "digitalocean"
 Header always set X-Content-Type-Options "nosniff"
 Header always set Referrer-Policy "strict-origin-when-cross-origin"
 Header always set Strict-Transport-Security "max-age=31536000"
 ErrorLog ${APACHE_LOG_DIR}/business-suite-error.log
 CustomLog ${APACHE_LOG_DIR}/business-suite-access.log combined
</VirtualHost>
