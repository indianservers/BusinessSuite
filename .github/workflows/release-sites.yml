name: Release all registered sites
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "Mockup images/**", "test-results/**", "frontend/test-results/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-production
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sites.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add the VERCEL_TOKEN repository secret to enable automatic releases. No sites were deployed."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: sites
        run: echo "matrix=$(python scripts/release_sites.py --matrix)" >> "$GITHUB_OUTPUT"
  portal-build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/interns-hub/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix frontend/interns-hub
      - run: npm run build --prefix frontend/interns-hub
        env:
          SUITE_RELEASE_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: interns-hub-${{ github.sha }}
          path: frontend/interns-hub/dist
          retention-days: 7
  deploy:
    needs: [prepare, portal-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global vercel@65.1.0
      - uses: actions/download-artifact@v4
        if: matrix.kind == 'interns-hub'
        with:
          name: interns-hub-${{ github.sha }}
          path: .local/portal-dist
      - name: Deploy and verify the live commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python scripts/release_sites.py --site '${{ matrix.id }}' --deploy --portal-dist .local/portal-dist
