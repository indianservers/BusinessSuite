name: Security regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  authorization-and-workflows:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      FAST_TEST_PASSWORD_HASHES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: >-
          python -m pytest tests/test_security_sessions.py
          tests/test_security_employee_scope.py tests/test_security_files_and_formulas.py
          tests/test_security_test_isolation.py tests/test_shared_batch_migration.py
          tests/test_security_employee_passwords.py tests/test_security_logging.py
          tests/test_security_realtime.py
          tests/test_intern_evidence_storage.py tests/test_intern_applications.py
          tests/test_intern_management.py tests/test_interns_hub.py -q
        working-directory: backend
  dependency-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=critical
        working-directory: frontend
      - run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=critical
        working-directory: frontend/interns-hub
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      # Deliberately fails on unresolved Python advisories; no silent allowlist.
      - run: pip-audit -r backend/requirements.txt --format json --output python-advisories.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-advisories
          path: python-advisories.json
